<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Switch</title>
    <style>
        body {
            margin: 0;
            padding: 56px 20px;
            background: #f4f1fa;
            color: #332e45;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 26px 30px;
            background: #fff;
            border: 1px solid #e9e4f1;
            border-top: 4px solid #8b72bd;
            border-radius: 6px 6px 14px 14px;
            box-shadow: 0 10px 28px rgba(51, 46, 69, 0.07);
        }

        h1 {
            margin: 0 0 22px;
            color: #67518f;
            font-size: 1.65rem;
        }

        #outputBox {
            padding: 14px 18px;
            background: #f8f6fc;
            border-left: 3px solid #c4b5df;
            border-radius: 0 6px 6px 0;
            line-height: 2;
        }
    </style>
</head>
<body>
    <main>
        <h1>Grade Switch</h1>
        <div id="outputBox"></div>
    </main>
    <script src="grade-switch.js"></script>
</body>
</html>
