<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Check</title>
    <style>
        body {
            margin: 0;
            padding: 48px 20px;
            background: #eef5f4;
            color: #263d3b;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 30px;
            background: #fff;
            border: 1px solid #d6e5e2;
            border-radius: 16px;
        }

        h1 {
            margin: 0 0 18px;
            color: #28766d;
            font-size: 1.6rem;
        }

        #output {
            padding: 16px;
            background: #f5faf9;
            border-radius: 8px;
            line-height: 1.9;
        }
    </style>
</head>
<body>
    <main>
        <h1>Grade Check</h1>
        <div id="output"></div>
    </main>
    <script src="grade-check.js"></script>
</body>
</html>
