<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Check</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background: #f3f6fa;
            color: #263449;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        main {
            width: min(100%, 520px);
            padding: 30px;
            background: #fff;
            border: 1px solid #e1e7ef;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(38, 52, 73, 0.07);
        }

        h1 {
            margin: 0 0 18px;
            color: #315b82;
            font-size: 1.6rem;
        }

        #output {
            padding: 16px 18px;
            background: #f2f7fb;
            border: 1px solid #e4edf4;
            border-radius: 10px;
            line-height: 1.9;
        }

        @media (max-width: 480px) {
            main {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Grade Check</h1>
        <div id="output"></div>
    </main>
    <script src="grade-check.js"></script>
</body>
</html>
